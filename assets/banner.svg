<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" rx="15" fill="url(#grad1)" />
  <text x="50%" y="45%" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle" filter="url(#shadow)">Awesome AI To-Do</text>
  <text x="50%" y="65%" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.9">Autonomous Agents • Auto-Prioritization • Self-Executing Tasks</text>
  <path d="M50 150 L750 150" stroke="white" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
  <circle cx="400" cy="150" r="10" fill="white" />
  <circle cx="200" cy="150" r="6" fill="white" opacity="0.6" />
  <circle cx="600" cy="150" r="6" fill="white" opacity="0.6" />
</svg>
